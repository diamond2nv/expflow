[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expflow-pde"
version = "0.7.3"
description = "Experiment workflow orchestration toolkit for PDEBench/Agentic4Sci — clearml + optuna + langfuse integration, dataset compliance, distributed experiment dispatch."
authors = [
    {name = "Li Shen"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["experiment", "clearml", "optuna", "mlops", "pdebench", "agentic4sci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "typer>=0.9",
    "fysom>=2.1.6",
]

[project.urls]
Homepage = "https://github.com/diamond2nv/expflow"
Repository = "https://github.com/diamond2nv/expflow"
Source = "https://github.com/diamond2nv/expflow"
BugTracker = "https://github.com/diamond2nv/expflow/issues"
Documentation = "https://github.com/diamond2nv/expflow#readme"

[project.optional-dependencies]
clearml = [
    "clearml>=1.17",
]
optuna = [
    "optuna>=4.0",
]
langfuse = [
    "langfuse>=2.56",
]
mcp = [
    "expflow-pde[clearml]",
    "expflow-pde[optuna]",
    "expflow-pde[langfuse]",
]
pipeline = [
    "clearml>=1.17",
]
all = [
    "expflow-pde[clearml,optuna,langfuse,pipeline]",
]
ingest = [
    "fastapi>=0.133.0",
    "uvicorn>=0.30",
]
dev = [
    "ruff",
    "pyright",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "torch>=2.0",
    "clearml>=1.17",
    "optuna>=4.0",
]

[project.scripts]
expflow = "expflow_pde.cli:main"

[tool.setuptools.packages.find]
include = ["expflow_pde*"]

[tool.setuptools.package-data]
expflow_pde = ["skills/*.md"]
"*" = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests as slow, deselected by default",
    "integration: marks tests that need external services (clearml/optuna/langfuse)",
]

[tool.coverage.run]
source = ["expflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"expflow_pde/losses.py" = ["N801", "N806"]
"expflow_pde/metrics.py" = ["N803", "N806"]

[tool.pyright]
include = ["expflow_pde"]
exclude = ["tests"]
reportMissingImports = true
reportMissingTypeStubs = false
strict = ["expflow_pde/**/[!__]*.py"]
